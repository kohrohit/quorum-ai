<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2"/>
      <stop offset="100%" style="stop-color:#357abd"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Three nodes representing council members -->
  <circle cx="256" cy="140" r="42" fill="#fff" opacity="0.95"/>
  <circle cx="155" cy="330" r="42" fill="#fff" opacity="0.95"/>
  <circle cx="357" cy="330" r="42" fill="#fff" opacity="0.95"/>
  <!-- Connection lines between nodes -->
  <line x1="256" y1="182" x2="155" y2="288" stroke="#fff" stroke-width="6" opacity="0.5"/>
  <line x1="256" y1="182" x2="357" y2="288" stroke="#fff" stroke-width="6" opacity="0.5"/>
  <line x1="155" y1="330" x2="357" y2="330" stroke="#fff" stroke-width="6" opacity="0.5"/>
  <!-- Center consensus point -->
  <circle cx="256" cy="265" r="22" fill="#fff"/>
  <circle cx="256" cy="265" r="12" fill="#4a90e2"/>
  <!-- Checkmark in center -->
  <polyline points="249,265 254,271 264,258" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Node inner dots -->
  <circle cx="256" cy="140" r="16" fill="#4a90e2"/>
  <circle cx="155" cy="330" r="16" fill="#2d8a2d"/>
  <circle cx="357" cy="330" r="16" fill="#e65100"/>
</svg>
